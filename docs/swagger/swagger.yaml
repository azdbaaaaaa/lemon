basePath: /api/v1
definitions:
  auth.ErrorResponse:
    properties:
      code:
        description: 错误码（非0表示错误）
        type: integer
      detail:
        description: 错误详情（可选）
        type: string
      message:
        description: 错误消息
        type: string
    type: object
  auth.LoginRequest:
    properties:
      password:
        description: 密码（必填）
        type: string
      username:
        description: 用户名（必填）
        type: string
    required:
    - password
    - username
    type: object
  auth.RefreshTokenRequest:
    properties:
      refresh_token:
        description: Refresh Token（必填）
        type: string
    required:
    - refresh_token
    type: object
  auth.RegisterRequest:
    properties:
      email:
        description: 邮箱（必填，需符合邮箱格式）
        type: string
      nickname:
        description: 昵称（可选）
        type: string
      password:
        description: 密码（必填，至少6位）
        minLength: 6
        type: string
      username:
        description: 用户名（必填，3-50字符）
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  content.CreateNovelRequest:
    properties:
      narration_type:
        description: 旁白类型：narration（旁白/解说）或 dialogue（真人对话）
        type: string
      resource_id:
        description: 资源ID（必填）
        type: string
      style:
        description: 风格：anime（漫剧）、live（真人剧）、mixed（混合）
        type: string
      user_id:
        description: 用户ID（必填）
        type: string
    required:
    - narration_type
    - resource_id
    - style
    - user_id
    type: object
  content.GenerateCharacterImagesRequest:
    properties:
      novel_id:
        description: 小说ID（必填）
        type: string
    required:
    - novel_id
    type: object
  content.GeneratePropImagesRequest:
    properties:
      novel_id:
        description: 小说ID（必填）
        type: string
    required:
    - novel_id
    type: object
  content.GenerateSceneImagesRequest:
    properties:
      chapter_id:
        description: 章节ID（必填）
        type: string
      version:
        description: 版本号（可选，不传则使用最新版本）
        type: integer
    required:
    - chapter_id
    type: object
  content.RegenerateShotScriptRequest:
    properties:
      shot_id:
        description: 分镜头ID（必填）
        type: string
    required:
    - shot_id
    type: object
  content.SplitChaptersRequest:
    properties:
      novel_id:
        description: 小说ID（必填）
        type: string
      target_chapters:
        description: 目标章节数（必填，至少1章）
        minimum: 1
        type: integer
    required:
    - novel_id
    - target_chapters
    type: object
  content.SyncCharactersRequest:
    properties:
      chapter_id:
        description: 章节ID（必填）
        type: string
      novel_id:
        description: 小说ID（必填）
        type: string
      version:
        description: 版本号（可选，不传则使用最新版本）
        type: integer
    required:
    - chapter_id
    - novel_id
    type: object
  content.UpdateShotRequest:
    properties:
      camera_movement:
        description: 运镜方式
        type: string
      duration:
        description: 时长（秒）
        type: number
      image_prompt:
        description: 图片提示词
        type: string
      narration:
        description: 解说内容
        type: string
      shot_id:
        description: 分镜头ID（必填）
        type: string
      video_prompt:
        description: 视频提示词
        type: string
    required:
    - shot_id
    type: object
  http.ErrorResponse:
    properties:
      code:
        description: 错误码（非0表示错误）
        type: integer
      detail:
        description: 错误详情（可选）
        type: string
      message:
        description: 错误消息
        type: string
    type: object
  novel.ErrorResponse:
    properties:
      code:
        description: 错误码（非0表示错误）
        type: integer
      detail:
        description: 错误详情（可选）
        type: string
      message:
        description: 错误消息
        type: string
    type: object
  resource.ErrorResponse:
    properties:
      code:
        description: 错误码（非0表示错误）
        type: integer
      detail:
        description: 错误详情（可选）
        type: string
      message:
        description: 错误消息
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@lemon.ai
    name: API Support
  description: |-
    Lemon is an AI-powered API service built with Eino framework.
    It provides LLM chat, intelligent agent, and more AI capabilities.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Lemon API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: 用户登录，返回Access Token和Refresh Token
      parameters:
      - description: 登录请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: 用户登录
      tags:
      - 认证
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: 退出登录，使Token失效
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 退出登录
      tags:
      - 认证
  /api/v1/auth/me:
    get:
      consumes:
      - application/json
      description: 获取当前登录用户的详细信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取当前用户信息
      tags:
      - 认证
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: 使用Refresh Token刷新Access Token
      parameters:
      - description: 刷新Token请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: 刷新Token
      tags:
      - 认证
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: 注册新用户，注册后状态为inactive，需要管理员审核
      parameters:
      - description: 注册请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: 用户注册
      tags:
      - 认证
  /api/v1/chapters:
    get:
      consumes:
      - application/json
      description: 根据小说ID获取该小说的所有章节列表，按序号排序
      parameters:
      - description: 小说ID
        in: query
        name: novel_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '成功响应"  "{\"code\": 0, \"message\": \"success\", \"data\":
            {\"novel_id\": \"...\", \"chapters\": [...], \"count\": 10}}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: 获取章节列表
      tags:
      - 内容管理
  /api/v1/chapters/split:
    post:
      consumes:
      - application/json
      description: 根据小说内容切分章节，将小说文本按照目标章节数切分成多个章节。这是小说处理流程的第二步。
      parameters:
      - description: 切分章节请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/content.SplitChaptersRequest'
      produces:
      - application/json
      responses:
        "200":
          description: '成功响应"  "{\"code\": 0, \"message\": \"章节切分成功\", \"data\": {\"novel_id\":
            \"...\", \"target_chapters\": 10, \"message\": \"已切分为 10 个章节\"}}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: 切分章节
      tags:
      - 内容管理
  /api/v1/characters:
    get:
      consumes:
      - application/json
      description: 获取小说的所有角色列表。
      parameters:
      - description: 小说ID
        in: query
        name: novel_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '成功响应"  "{\"code\": 0, \"message\": \"获取成功\", \"data\": [...]}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: 获取角色列表
      tags:
      - 内容管理
  /api/v1/characters/detail:
    get:
      consumes:
      - application/json
      description: 根据名称获取角色信息。
      parameters:
      - description: 小说ID
        in: query
        name: novel_id
        required: true
        type: string
      - description: 角色名称
        in: query
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '成功响应"  "{\"code\": 0, \"message\": \"获取成功\", \"data\": {...}}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: 角色不存在
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: 获取角色信息
      tags:
      - 内容管理
  /api/v1/characters/images:
    post:
      consumes:
      - application/json
      description: 为小说的所有角色生成图片（抽卡）
      parameters:
      - description: 生成角色图片请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/content.GenerateCharacterImagesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功响应
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: 生成角色图片
      tags:
      - 内容管理
  /api/v1/characters/sync:
    post:
      consumes:
      - application/json
      description: 从章节解说同步角色信息到小说级别，提取解说中的角色信息并保存到角色表。
      parameters:
      - description: 同步角色请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/content.SyncCharactersRequest'
      produces:
      - application/json
      responses:
        "200":
          description: '成功响应"  "{\"code\": 0, \"message\": \"角色同步成功\", \"data\": {...}}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: 同步角色信息
      tags:
      - 内容管理
  /api/v1/narrations/{narration_id}/audios:
    get:
      responses: {}
    post:
      consumes:
      - application/json
      description: 为章节解说生成所有章节音频片段，使用TTS服务生成音频。音频生成是异步的，提交任务后需要通过状态查询接口轮询进度。
      parameters:
      - description: 解说ID
        in: path
        name: narration_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '成功响应"  "{\"code\": 0, \"message\": \"音频生成任务已提交\", \"data\":
            {\"audio_ids\": [\"...\"], \"count\": 1, \"narration_id\": \"...\"}}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/novel.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/novel.ErrorResponse'
      summary: 生成章节音频
      tags:
      - 音频生成
  /api/v1/narrations/{narration_id}/audios/versions:
    get:
      consumes:
      - application/json
      description: 获取章节解说的所有音频版本号列表。
      parameters:
      - description: 解说ID
        in: path
        name: narration_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '成功响应"  "{\"code\": 0, \"message\": \"获取成功\", \"data\": {\"narration_id\":
            \"...\", \"versions\": [1, 2, 3]}}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/novel.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/novel.ErrorResponse'
      summary: 获取音频版本列表
      tags:
      - 音频生成
  /api/v1/narrations/{narration_id}/images:
    get:
      responses: {}
    post:
      consumes:
      - application/json
      description: 为章节解说生成所有章节图片，使用图片生成服务（Ark API）生成图片。图片生成是异步的，提交任务后需要通过状态查询接口轮询进度。
      parameters:
      - description: 解说ID
        in: path
        name: narration_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '成功响应"  "{\"code\": 0, \"message\": \"图片生成任务已提交\", \"data\":
            {\"image_ids\": [\"...\"], \"count\": 1, \"narration_id\": \"...\"}}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/novel.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/novel.ErrorResponse'
      summary: 生成章节图片
      tags:
      - 图片生成
  /api/v1/narrations/{narration_id}/subtitles:
    get:
      responses: {}
    post:
      consumes:
      - application/json
      description: 为章节解说生成所有字幕文件（ASS格式），为每个 narration shot 生成单独的字幕文件，与音频片段一一对应。需要先有章节音频记录（包含时间戳数据）。
      parameters:
      - description: 解说ID
        in: path
        name: narration_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '成功响应"  "{\"code\": 0, \"message\": \"字幕生成任务已提交\", \"data\":
            {\"subtitle_ids\": [\"...\"], \"count\": 1, \"narration_id\": \"...\"}}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/novel.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/novel.ErrorResponse'
      summary: 生成章节字幕
      tags:
      - 字幕生成
  /api/v1/novels:
    get:
      consumes:
      - application/json
      description: 根据当前用户获取剧本列表（分页）
      parameters:
      - description: 页码，默认1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认10
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: '成功响应"  "{\"code\": 0, \"message\": \"success\", \"data\":
            {\"novels\": [...], \"total\": 100, \"page\": 1, \"page_size\": 10}}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: 获取剧本列表
      tags:
      - 内容管理
    post:
      consumes:
      - application/json
      description: 根据资源ID创建剧本，返回剧本ID。这是剧本处理流程的第一步。
      parameters:
      - description: 创建剧本请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/content.CreateNovelRequest'
      produces:
      - application/json
      responses:
        "201":
          description: '成功响应"  "{\"code\": 0, \"message\": \"剧本创建成功\", \"data\": {\"novel_id\":
            \"...\"}}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: 创建剧本
      tags:
      - 内容管理
  /api/v1/novels/chapters/{chapter_id}/images/versions:
    get:
      consumes:
      - application/json
      description: 获取章节的所有图片版本号列表。
      parameters:
      - description: 章节ID
        in: path
        name: chapter_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '成功响应"  "{\"code\": 0, \"message\": \"获取成功\", \"data\": {\"chapter_id\":
            \"...\", \"versions\": [1, 2, 3]}}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/novel.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/novel.ErrorResponse'
      summary: 获取图片版本列表
      tags:
      - 图片生成
  /api/v1/novels/chapters/{chapter_id}/subtitles/versions:
    get:
      consumes:
      - application/json
      description: 获取章节的所有字幕版本号列表。
      parameters:
      - description: 章节ID
        in: path
        name: chapter_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '成功响应"  "{\"code\": 0, \"message\": \"获取成功\", \"data\": {\"chapter_id\":
            \"...\", \"versions\": [1, 2, 3]}}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/novel.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/novel.ErrorResponse'
      summary: 获取字幕版本列表
      tags:
      - 字幕生成
  /api/v1/novels/chapters/{chapter_id}/videos:
    get:
      responses: {}
  /api/v1/novels/chapters/{chapter_id}/videos/final:
    post:
      consumes:
      - application/json
      description: 拼接所有 narration 视频，添加 finish.mp4，生成章节的最终完整视频。需要确保所有 narration 视频已完成（status=completed）。
      parameters:
      - description: 章节ID
        in: path
        name: chapter_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '成功响应"  "{\"code\": 0, \"message\": \"最终视频生成成功\", \"data\":
            {\"video_id\": \"...\", \"chapter_id\": \"...\"}}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误（如没有找到 narration 视频）
          schema:
            $ref: '#/definitions/novel.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/novel.ErrorResponse'
      summary: 生成章节的最终完整视频
      tags:
      - 视频生成
  /api/v1/novels/chapters/{chapter_id}/videos/narration:
    post:
      consumes:
      - application/json
      description: 为章节生成所有 narration 视频，所有分镜都单独生成视频，使用图生视频方式（Ark API 或 FFmpeg）。视频生成是异步的，提交任务后需要通过状态查询接口轮询进度。
      parameters:
      - description: 章节ID
        in: path
        name: chapter_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '成功响应"  "{\"code\": 0, \"message\": \"视频生成任务已提交\", \"data\":
            {\"video_ids\": [\"...\"], \"count\": 1, \"chapter_id\": \"...\"}}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/novel.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/novel.ErrorResponse'
      summary: 生成章节的 narration 视频
      tags:
      - 视频生成
  /api/v1/novels/chapters/{chapter_id}/videos/versions:
    get:
      consumes:
      - application/json
      description: 获取章节的所有视频版本号，用于查看历史版本或选择特定版本。每次生成视频都会创建新版本。
      parameters:
      - description: 章节ID
        in: path
        name: chapter_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '成功响应"  "{\"code\": 0, \"message\": \"success\", \"data\":
            {\"versions\": [1, 2, 3], \"count\": 3, \"chapter_id\": \"...\"}}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/novel.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/novel.ErrorResponse'
      summary: 获取章节的视频版本号列表
      tags:
      - 视频查询
  /api/v1/novels/detail:
    get:
      consumes:
      - application/json
      description: 根据剧本ID获取剧本的详细信息
      parameters:
      - description: 剧本ID
        in: query
        name: novel_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '成功响应"  "{\"code\": 0, \"message\": \"success\", \"data\":
            {\"novel\": {...}}}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: 剧本不存在
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: 获取剧本信息
      tags:
      - 内容管理
  /api/v1/props/images:
    post:
      consumes:
      - application/json
      description: 为小说的所有道具生成图片（抽卡）
      parameters:
      - description: 生成道具图片请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/content.GeneratePropImagesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功响应
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: 生成道具图片
      tags:
      - 内容管理
  /api/v1/resources:
    get:
      consumes:
      - application/json
      description: 查询资源列表，支持按用户ID、扩展名、状态等条件筛选，支持分页
      parameters:
      - description: 用户ID
        in: query
        name: user_id
        type: string
      - description: 文件扩展名筛选
        in: query
        name: ext
        type: string
      - description: 状态筛选
        in: query
        name: status
        type: string
      - description: 页码（默认1）
        in: query
        name: page
        type: integer
      - description: 每页数量（默认20，最大100）
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: '成功响应"  "{\"code\": 0, \"message\": \"success\", \"data\":
            {\"resources\": [...], \"total\": 100, \"page\": 1, \"page_size\": 20}}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/resource.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/resource.ErrorResponse'
      summary: 查询资源列表
      tags:
      - 资源管理
  /api/v1/resources/{resource_id}:
    get:
      consumes:
      - application/json
      description: 根据资源ID获取资源的详细信息（元数据，不包含文件内容）
      parameters:
      - description: 资源ID
        in: path
        name: resource_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '成功响应"  "{\"code\": 0, \"message\": \"success\", \"data\":
            {\"resource\": {...}}}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/resource.ErrorResponse'
        "404":
          description: 资源不存在
          schema:
            $ref: '#/definitions/resource.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/resource.ErrorResponse'
      summary: 获取资源信息
      tags:
      - 资源管理
  /api/v1/resources/{resource_id}/download:
    get:
      consumes:
      - application/json
      description: 根据资源ID下载文件，返回文件流
      parameters:
      - description: 资源ID
        in: path
        name: resource_id
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: 文件流
          schema:
            type: file
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/resource.ErrorResponse'
        "404":
          description: 资源不存在
          schema:
            $ref: '#/definitions/resource.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/resource.ErrorResponse'
      summary: 下载文件
      tags:
      - 资源管理
  /api/v1/resources/{resource_id}/download-url:
    get:
      consumes:
      - application/json
      description: 根据资源ID获取预签名的下载URL，适用于客户端直接下载
      parameters:
      - description: 资源ID
        in: path
        name: resource_id
        required: true
        type: string
      - description: 过期时间（秒，默认3600）
        in: query
        name: expires_in
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: '成功响应"  "{\"code\": 0, \"message\": \"success\", \"data\":
            {\"resource_id\": \"...\", \"download_url\": \"...\", \"expires_at\":
            \"...\", \"file_name\": \"...\", \"file_size\": 1024, \"content_type\":
            \"...\"}}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/resource.ErrorResponse'
        "404":
          description: 资源不存在
          schema:
            $ref: '#/definitions/resource.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/resource.ErrorResponse'
      summary: 获取下载URL
      tags:
      - 资源管理
  /api/v1/resources/upload:
    post:
      consumes:
      - multipart/form-data
      description: 通过 multipart/form-data 上传文件到服务端，服务端会保存文件并创建资源记录
      parameters:
      - description: 上传的文件
        in: formData
        name: file
        required: true
        type: file
      - description: 用户ID（可选，如果为空则从认证信息中获取）
        in: formData
        name: user_id
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: '成功响应"  "{\"code\": 0, \"message\": \"文件上传成功\", \"data\": {\"resource_id\":
            \"...\", \"resource_url\": \"...\", \"file_size\": 1024, \"file_name\":
            \"...\"}}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/resource.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/resource.ErrorResponse'
      summary: 上传文件
      tags:
      - 资源管理
  /api/v1/scenes:
    get:
      consumes:
      - application/json
      description: 根据章节ID和版本号获取场景列表（按 sequence 排序）。如果不传版本号，则获取最新版本。
      parameters:
      - description: 章节ID
        in: query
        name: chapter_id
        required: true
        type: string
      - description: 版本号（可选，不传则获取最新版本）
        in: query
        name: version
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功响应
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: 获取场景列表
      tags:
      - 内容管理
  /api/v1/scenes/images:
    post:
      consumes:
      - application/json
      description: 为章节的所有场景生成图片（抽卡）
      parameters:
      - description: 生成场景图片请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/content.GenerateSceneImagesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功响应
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: 生成场景图片
      tags:
      - 内容管理
  /api/v1/shots:
    get:
      consumes:
      - application/json
      description: 根据章节ID和版本号获取镜头列表（按 index 排序）。镜头中包含解说内容。如果不传版本号，则获取最新版本。
      parameters:
      - description: 章节ID
        in: query
        name: chapter_id
        required: true
        type: string
      - description: 版本号（可选，不传则获取最新版本）
        in: query
        name: version
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功响应
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: 获取镜头列表
      tags:
      - 内容管理
    put:
      consumes:
      - application/json
      description: 更新分镜头的脚本信息（解说、图片提示词、视频提示词、运镜方式、时长等）
      parameters:
      - description: 请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/content.UpdateShotRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功响应
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: 更新分镜头信息
      tags:
      - 内容管理
  /api/v1/shots/regenerate:
    post:
      consumes:
      - application/json
      description: 调用 LLM 重新生成分镜头的脚本信息（解说、图片提示词、视频提示词、运镜方式、时长等）
      parameters:
      - description: 请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/content.RegenerateShotScriptRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功响应
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: 重新生成分镜头脚本
      tags:
      - 内容管理
  /api/v1/videos:
    get:
      consumes:
      - application/json
      description: 根据状态查询视频列表，用于轮询视频生成进度。支持的状态：pending（待处理）、processing（处理中）、completed（已完成）、failed（失败）
      parameters:
      - description: 视频状态：pending, processing, completed, failed
        in: query
        name: status
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '成功响应"  "{\"code\": 0, \"message\": \"success\", \"data\":
            {\"videos\": [...], \"count\": 1, \"status\": \"pending\"}}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误（如 status 参数无效）
          schema:
            $ref: '#/definitions/novel.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/novel.ErrorResponse'
      summary: 根据状态查询视频
      tags:
      - 视频查询
  /health:
    get:
      consumes:
      - application/json
      description: 检查服务健康状态
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 健康检查
      tags:
      - 健康检查
  /ready:
    get:
      consumes:
      - application/json
      description: 检查服务是否就绪
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 就绪检查
      tags:
      - 健康检查
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
